name: Собрать APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk Vershina.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vershina-apk
          path: Vershina.apk
      - name: Опубликовать в Releases (ссылка для телефона)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Vershina.apk --title "Вершина — последняя сборка" --notes "Скачайте Vershina.apk на телефон и установите. Сборка №${{ github.run_number }}."
