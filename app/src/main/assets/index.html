const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

let AC=null,MG=null,NB=null,windGain=null,windF=null;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain(); MG.gain.value=0.55; MG.connect(AC.destination);
    const len=AC.sampleRate*2; NB=AC.createBuffer(1,len,AC.sampleRate);
    const d=NB.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const s=AC.createBufferSource(); s.buffer=NB; s.loop=true;
    windF=AC.createBiquadFilter(); windF.type='bandpass'; windF.frequency.value=450; windF.Q.value=0.6;
    windGain=AC.createGain(); windGain.gain.value=0.04;
    s.connect(windF); windF.connect(windGain); windGain.connect(MG); s.start();
  }catch(e){ AC=null; }
}
function noise(dur,f,type,gain,q,f2){
  const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=NB;
  const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t);
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q||1;
  const g=AC.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(fl); fl.connect(g); g.connect(MG); s.start(t,Math.random()*1.5); s.stop(t+dur+0.05);
}
function tone(f,dur,type,gain,f2){
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t+dur+0.05);
}
function screech(f0,f1,dur,v){
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain(),bp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  l.frequency.value=28; lg.gain.value=f0*0.08; l.connect(lg); lg.connect(o.frequency);
  bp.type='bandpass'; bp.frequency.value=f0*1.2;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.08*v,t+0.04); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(bp); bp.connect(g); g.connect(MG); o.start(t); l.start(t); o.stop(t+dur+0.05); l.stop(t+dur+0.05);
}
function sfx(n,v){
  if(!AC) return; v=v===undefined?1:v;
  try{ switch(n){
    case 'step': noise(0.08,700+rnd(500),'lowpass',0.10*v,0.7); break;
    case 'throw': noise(0.35,400,'bandpass',0.18,1.5,1800); break;
    case 'whoosh': noise(0.1,600+v*900,'bandpass',0.05,2); break;
    case 'latch': tone(1900,0.15,'triangle',0.1,1300); noise(0.05,3000,'highpass',0.1); break;
    case 'hammer': tone(1100+v*900,0.22,'square',0.05,800+v*500); tone(2500+v*500,0.2,'sine',0.07); noise(0.04,2500,'highpass',0.22); break;
    case 'shot': noise(0.32,1400,'lowpass',0.6,0.5,180); tone(140,0.15,'sine',0.4,45); break;
    case 'click': tone(2400,0.03,'square',0.05); break;
    case 'mag': tone(900,0.05,'square',0.07); noise(0.05,2000,'bandpass',0.15,3); break;
    case 'eagle': screech(1500,650,0.65,v); break;
    case 'raven': screech(520,380,0.18,v*1.3); setTimeout(()=>{try{screech(500,360,0.18,v*1.2);}catch(e){}},230); break;
    case 'vulture': noise(0.6,350,'bandpass',0.25*v,2,180); screech(300,180,0.5,v*0.7); break;
    case 'boom': noise(2.5,600,'lowpass',0.9,0.5,60); tone(60,1.2,'sine',0.6,25); break;
    case 'hit': noise(0.2,500,'lowpass',0.4); tone(90,0.2,'sine',0.3,40); break;
    case 'thud': noise(0.15,300,'lowpass',0.5*v); break;
    case 'jerk': tone(220,0.1,'triangle',0.1,120); noise(0.08,800,'bandpass',0.2); break;
    case 'pick': tone(660,0.08,'sine',0.1); setTimeout(()=>{try{tone(990,0.12,'sine',0.1);}catch(e){}},80); break;
    case 'rotor': noise(0.06,220,'lowpass',0.22*v); break;
    case 'hiss': noise(0.7,5000,'highpass',0.12*v,0.7); break;
    case 'inject': tone(400,0.25,'sine',0.06,260); break;
    case 'pause': tone(520,0.06,'sine',0.06); break;
  } }catch(e){}
}

// ================= снег на поверхностях =================
class Surface{
  constructor(x0,x1,y,depth,bottom){
    this.x0=x0; this.x1=x1; this.y=y; this.bottom=bottom||3;
    this.n=Math.ceil((x1-x0)/2)+1; this.b=new Float32Array(this.n); this.h=new Float32Array(this.n);
    const s=Math.random()*100;
    for(let i=0;i<this.n;i++){
      const x=x0+i*2;
      let v=depth+Math.sin(x*0.03+s)*1.4+Math.sin(x*0.11+s*2)*0.6+Math.sin(x*0.31+s)*0.25;
      const e=Math.min(i,this.n-1-i)*2; if(bottom!==800) v*=clamp(e/14,0.25,1);
      this.b[i]=v; this.h[i]=v;
    }
  }
  top(x){ const i=clamp(Math.round((x-this.x0)/2),0,this.n-1); return this.y-this.h[i]; }
  dent(x,r,d){
    const c=(x-this.x0)/2, ri=r/2;
    for(let i=Math.max(0,Math.floor(c-ri*1.7));i<=Math.min(this.n-1,Math.ceil(c+ri*1.7));i++){
      const k=(i-c)/ri, g=Math.exp(-k*k*2);
      this.h[i]=Math.max(0.4,this.h[i]-d*g);
      if(Math.abs(k)>1.05) this.h[i]+=d*0.12;
    }
  }
  update(dt){
    for(let i=0;i<this.n;i++){ const df=this.b[i]-this.h[i];
      if(df>0) this.h[i]+=Math.min(df,dt*0.06); else if(df<-0.2) this.h[i]+=Math.max(df,-dt*0.08); }
  }
  draw(vx0,vx1){
    if(vx1<this.x0||vx0>this.x1) return;
    const i0=clamp(Math.floor((vx0-this.x0)/2)-1,0,this.n-1), i1=clamp(Math.ceil((vx1-this.x0)/2)+1,0,this.n-1);
    const gr=ctx.createLinearGradient(0,this.y-12,0,this.y+40);
    gr.addColorStop(0,'#fbfcfd'); gr.addColorStop(1,'#d4dde6');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(this.x0+i0*2,this.y+this.bottom);
    for(let i=i0;i<=i1;i++) ctx.lineTo(this.x0+i*2,this.y-this.h[i]);
    ctx.lineTo(this.x0+i1*2,this.y+this.bottom); ctx.closePath(); ctx.fill();
    for(let i=i0;i<=i1;i++){ const d=this.b[i]-this.h[i];
      if(d>0.25){ ctx.fillStyle='rgba(110,138,170,'+Math.min(0.55,d*0.2).toFixed(3)+')';
        ctx.fillRect(this.x0+i*2-1,this.y-this.h[i],2,Math.min(7,d*1.3+1)); } }
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1; ctx.beginPath();
    for(let i=i0;i<=i1;i++){ const x=this.x0+i*2,y=this.y-this.h[i]; if(i===i0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.stroke();
    for(let i=i0;i<=i1;i+=3){ const k=hash(i*1.7+this.y); if(k>0.93 && Math.sin(T*3+k*50)>0.85){
      ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fillRect(this.x0+i*2,this.y-this.h[i]+1,1.2,1.2);} }
  }
}

// ================= скала =================
let rockPat=null;
function makeRock(){
  const c=document.createElement('canvas'); c.width=400; c.height=512; const g=c.getContext('2d');
  g.fillStyle='#adb5bd'; g.fillRect(0,0,400,512);
  const wrap=f=>{ for(const o of [-512,0,512]){ g.save(); g.translate(0,o); f(); g.restore(); } };
  for(let i=0;i<26;i++){ const x=rnd(400),y=rnd(512),w=rnd(40,140),h=rnd(20,60),l=rnd()<0.5;
    wrap(()=>{ g.fillStyle=l?'rgba(205,212,219,0.35)':'rgba(120,128,138,0.22)'; g.beginPath();
      g.moveTo(x,y); g.lineTo(x+w*0.6,y-h*0.3); g.lineTo(x+w,y+h*0.2); g.lineTo(x+w*0.4,y+h); g.closePath(); g.fill(); }); }
  for(let i=0;i<80;i++){ const y0=rnd(512), a=rnd(0.05,0.2), lw=rnd(0.5,2.4); const pts=[]; let x=-10,yy=y0;
    while(x<410){ pts.push([x,yy]); x+=rnd(10,30); yy+=rnd(-4,4); }
    wrap(()=>{ g.strokeStyle='rgba(55,64,74,'+a+')'; g.lineWidth=lw; g.beginPath(); pts.forEach((p,j)=>j?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke(); }); }
  for(let i=0;i<40;i++){ const x=rnd(400),y=rnd(512); const pts=[[x,y]]; let xx=x,yy=y; for(let k=0;k<5;k++){xx+=rnd(-5,5);yy+=rnd(5,12);pts.push([xx,yy]);}
    wrap(()=>{ g.strokeStyle='rgba(40,46,54,0.35)'; g.lineWidth=1; g.beginPath(); pts.forEach((p,j)=>j?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke(); }); }
  for(let i=0;i<34;i++){ const x=rnd(400),y=rnd(512),n=3+(rnd(5)|0), a=rnd(0.35,0.75), bl=[];
    for(let k=0;k<n;k++) bl.push([x+rnd(-14,14),y+rnd(-2,2),rnd(3,10),rnd(1.5,3.5)]);
    wrap(()=>{ g.fillStyle='rgba(244,247,250,'+a+')'; for(const q of bl){ g.beginPath(); g.ellipse(q[0],q[1],q[2],q[3],0,0,Math.PI*2); g.fill(); } }); }
  for(let i=0;i<4000;i++){ g.fillStyle=rnd()<0.5?'rgba(0,0,0,0.08)':'rgba(255,255,255,0.1)'; g.fillRect(rnd(400),rnd(512),1,1); }
  rockPat=ctx.createPattern(c,'repeat');
}

const LAST_GRIP=79;
function genGrip(i){
  if(i>LAST_GRIP) return;
  const prev=i>0?grips[i-1]:{x:200,y:0};
  const ledge=(i%8===7);
  let dy=ledge?100:78+hash(i*3.1)*42;
  let x=prev.x+(hash(i*7.7)-0.5)*230; x=clamp(x,62,338);
  if(ledge) x=200;
  const g={i,x,y:prev.y-dy,ledge,piton:0,pp:0,k:ledge?(i+1)/8:0,w:0.8+hash(i*5.3)*0.5,hw:17+hash(i*5.3)*9,snakes:[]};
  if(ledge){
    g.summit=g.k===10; g.surf=g.summit?new Surface(18,382,g.y,8,3):new Surface(30,370,g.y,6,3); g.surf.g=g; g.tent=g.k===1; g.tentX=292; g.flare=g.summit; g.flareX=200;
    g.med=g.k===2; g.medX=60;
    g.hut=g.k>=2&&g.k%2===0&&!g.summit; g.hutX=300;
    g.fire=g.k>=6; g.fireX=g.summit?80:g.hut?200:240;
    g.torch=g.k===6; g.torchX=140;
    g.crate=g.k>=2 && !g.summit && hash(i*1.3)<0.85; g.crateX=g.k===2?150:g.hut?72:70+hash(i*2.9)*120;
    if(g.k>=3&&!g.summit){ const n=1+(hash(i*9.1)<0.6?1:0)+(g.k>=6?1:0);
      for(let j=0;j<n;j++){ let sx=-1;
        for(let t=0;t<12&&sx<0;t++){ const c=50+hash(i*3.3+j*7.1+t*1.7)*300;
          const busy=(g.crate&&Math.abs(c-g.crateX)<28)||Math.abs(c-200)<24||(g.hut&&c>255)||(g.fire&&Math.abs(c-g.fireX)<40)||(g.torch&&Math.abs(c-g.torchX)<24)||g.snakes.some(q=>Math.abs(q.x-c)<40);
          if(!busy) sx=c; }
        if(sx<0) continue;
        g.snakes.push({x:clamp(sx,50,350),y:0,st:'hidden',t:rnd(3),f:hash(i+j)<0.5?-1:1,ph:rnd(6),g,vx:0,vy:0,rot:0,flick:rnd(2,5)}); } }
  }
  grips.push(g);
}
function grip(i){ if(i>LAST_GRIP) return null; while(grips.length<=i) genGrip(grips.length); return grips[i]; }

  let s=localStorage.getItem(SKEY); if(s) return JSON.parse(s);
  s=localStorage.getItem(SKEY1); if(s){ const o=JSON.parse(s); o.taken=(o.crates||[]).map(k=>'c'+k); o.syr=0; return o; }
  return null; }catch(e){ return null; } }
function loadGame(){
  const s=readSave(); if(!s||!s.gear){ startNew(RUN.diff); return; }
  RUN=readRun()||RUN; newWorld();
  Object.assign(P,{hasGear:true,hasPistol:!!s.pistol,mag:s.mag|0,mags:s.mags|0,syr:s.syr|0,meds:s.meds|0,carcB:s.carcB|0,carcS:s.carcS|0,carcG:s.carcG|0,laser:!!s.laser,taken:s.taken||[],ledgeK:s.k|0});
  if(Array.isArray(s.inv)&&s.inv.length===18) P.inv=s.inv.slice(); else if(Array.isArray(s.inv)&&s.inv.length===12) P.inv=s.inv.concat(new Array(6).fill(null));
  P.hasTorch=!!s.torch; P.fuel=s.fuel===undefined?1:s.fuel; P.hsel=s.hsel|0; if(s.weapon&&(s.weapon!=='gun'||P.hasPistol)&&(s.weapon!=='torch'||P.hasTorch)) P.weapon=s.weapon;
  if(P.ledgeK>0){ const g=grip(P.ledgeK*8-1); P.surf=g.surf; curIdx=g.i; P.x=150; lastAnchor={kind:'surf',surf:g.surf,g}; cam.x=0;
    for(const sk of g.snakes) if(Math.abs(sk.x-P.x)<60) sk.x=P.x+(sk.x<P.x?-70:70); }
  else { P.surf=ground; P.x=150; curIdx=-1; cam.x=-50; }
  P.y=P.surf.top(P.x)-FEET; cam.y=P.y-VH*0.6; scene='play'; invSync();
  showToast(P.ledgeK>0?'УСТУП '+P.ledgeK:'ПОДНОЖИЕ'); tut.loaded=true;
}

// ================= частицы и падающий снег =================
function addP(x,y,vx,vy,life,s,c,g,type){ if(parts.length<900) parts.push({x,y,vx,vy,life,max:life,s,c,g,type:type||'dot',r:rnd(6)}); }
function snowBurst(x,y,n,pw){ for(let i=0;i<n;i++) addP(x+rnd(-4,4),y,rnd(-1,1)*pw,-rnd(0.3,1)*pw,rnd(0.4,1.1),rnd(0.8,2.2),'#fff',500); }
function feathers(x,y,n,c){ for(let i=0;i<n;i++) addP(x,y,rnd(-90,90),rnd(-90,30),rnd(0.8,1.8),rnd(2,4),c||'#262b32',60,'feather'); }
function updateParts(dt){
  for(const p of parts){
    p.life-=dt; p.vy+=p.g*dt;
    if(p.type==='smoke'){ p.s+=dt*5; p.vx+=wind*0.5*dt; p.vx*=1-dt*0.5; }
    else if(p.type==='feather'){ p.vx*=1-dt*2.5; p.vy*=1-dt*1.5; p.vx+=wind*0.6*dt; p.r+=dt*4; }
    else if(p.type==='spark'){ p.vx*=1-dt*3; }
    else p.vx+=wind*0.3*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  parts=parts.filter(p=>p.life>0);
}
function drawParts(){
  for(const p of parts){ const a=clamp(p.life/p.max,0,1);
    if(p.type==='smoke'){ ctx.fillStyle='rgba(62,67,74,'+(a*0.32).toFixed(3)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fill(); }
    else if(p.type==='feather'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=a; ctx.fillStyle=p.c; ctx.beginPath(); ctx.ellipse(0,0,p.s,0.9,0,0,6.283); ctx.fill(); ctx.restore(); ctx.globalAlpha=1; }
    else if(p.type==='fire'){ ctx.fillStyle='rgba(230,120,50,'+(a*0.8).toFixed(3)+')'; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
    else { ctx.globalAlpha=a; ctx.fillStyle=p.c; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); ctx.globalAlpha=1; }
  }
}
function initFlakes(){ flakes=[]; for(let i=0;i<280;i++) flakes.push({x:rnd(VW),y:rnd(VH+40)-20,z:rnd(0.25,1.3),ph:rnd(6)}); }
initFlakes();
function updateFlakes(dt){
  const dx=cam.x-camPrev.x, dy=cam.y-camPrev.y; camPrev.x=cam.x; camPrev.y=cam.y;
  for(const f of flakes){
    f.y+=(12+34*f.z)*dt - dy*f.z; f.x+=(wind*f.z*0.9+Math.sin(T*1.3+f.ph)*7*f.z)*dt - dx*f.z;
    if(f.y>VH+12){ f.y-=VH+24; f.x=rnd(VW); } else if(f.y<-12){ f.y+=VH+24; f.x=rnd(VW); }
    if(f.x>VW+12) f.x-=VW+24; else if(f.x<-12) f.x+=VW+24;
  }
}
function drawFlakes(front){
  for(const f of flakes){ if((f.z>0.95)!==front) continue;
    ctx.fillStyle='rgba(255,255,255,'+(0.5+0.45*Math.min(1,f.z)).toFixed(2)+')';
    const s=0.6+1.7*f.z;
    if(s>2){ ctx.beginPath(); ctx.arc(f.x,f.y,s/2,0,6.283); ctx.fill(); } else ctx.fillRect(f.x,f.y,s,s);
  }
}

// ================= поза тела и рэгдолл =================
// точки: 0 голова,1 шея,2 таз,3 локоть Л,4 кисть Л,5 локоть П,6 кисть П,7 колено Л,8 стопа Л,9 колено П,10 стопа П
const RS=[[0,1,6],[1,2,14],[1,3,8],[3,4,8],[1,5,8],[5,6,8],[2,7,8.6],[7,8,8.6],[2,9,8.6],[9,10,8.6],[0,2,20]];
const RMIN=[[3,2,9],[5,2,9],[7,1,15],[9,1,15],[8,2,7],[10,2,7],[4,0,4],[6,0,4],[8,10,3],[4,6,3]];
function handPos(){ return P.state==='hang' ? {x:P.x+7*P.f,y:P.y-14} : {x:P.x+5*P.f,y:P.y-17}; }
function kneeOf(a,b,f,seg){ const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,h=Math.sqrt(Math.max(0,seg*seg-L*L/4));
  return [(a[0]+b[0])/2-dy/L*h*f,(a[1]+b[1])/2+dx/L*h*f]; }
function gunOutFor(st){ return P.hasPistol&&P.weapon==='gun'&&(st==='stand'||st==='hang')&&overlay!=='reload'&&!P.snake; }
function torchOutFor(st){ return P.hasTorch&&P.weapon==='torch'&&(st==='stand'||st==='hang'||st==='pull'||st==='air')&&!P.snake&&!P.inShop; }
function computePose(mode){
  const p=P,f=p.f,st=mode||p.state,hs=hook.state,hp=handPos(),hl=[hp.x-p.x,hp.y-p.y];
  let head=[0,-14],neck=[0,-8],pel=[0,6],lf,rf,lh,rh;
  if(st==='stand'||st==='rise'){
    const sp=clamp(Math.abs(p.vx)/72,0,1),s=p.step*Math.PI,sw=Math.sin(s)*sp;
    lf=[sw*7,22-Math.max(0,Math.cos(s))*2.5*sp]; rf=[-sw*7,22-Math.max(0,-Math.cos(s))*2.5*sp];
    lh=[-sw*5-f*2,5]; rh=[sw*5+f*2,5];
    if(st==='stand'&&(hs==='spin'||hs==='latched'||hs==='fly')) rh=hl;
    if(st==='rise'&&p.riseT<0.8){ lh=[f*8,18]; rh=[f*10,16]; }
    if(st==='stand'&&p.snake){ head=[f*3,-13]; neck=[f*2,-7]; lh=[f*5,12]; rh=[f*8,13]; lf=[f*3,22]; }
  } else if(st==='air'){ const up=p.vy<0; lf=[f*5,up?17:20]; rf=[-f*3,up?19:21]; lh=[-f*7,up?-12:-4]; rh=[f*9,up?-14:-6];
  } else if(st==='crouch'){ pel=[-f*2,13]; neck=[f*3,-1]; head=[f*5,-7]; lf=[-3,22]; rf=[5,22]; lh=[f*8,15]; rh=[f*10,14]; }
  else if(st==='hang'){
    const g=p.hangG, gx=g.x-p.x, gy=g.y-p.y; lh=[gx-3,gy+2]; rh=[gx+3,gy+2];
    if(hs!=='idle') rh=hl; const sw=Math.sin(T*1.7)*2; lf=[-4+sw+f*3,21]; rf=[4+sw*0.6+f*3,20];
  } else if(st==='pull'){
    const s=p.pullP*28, lag=clamp((p.thV||0)*4,-7,7);
    lh=[-2,-22]; rh=[2,-23]; lf=[Math.sin(s)*4+f*3-lag,20]; rf=[-Math.sin(s)*4+f*3-lag*1.3,21];
  } else { lh=[-8,4]; rh=[8,4]; lf=[-4,22]; rf=[4,22]; }
  if(gunOutFor(st)){ const ax=p.aimT>0?p.aimx:f, ay=p.aimT>0?p.aimy:0.12;          // руки вытянуты к цели, вторая поддерживает
    rh=[ax*14,-6+ay*14]; if(st==='stand') lh=[ax*12+ay*1.5,-5+ay*12]; }
  else if(torchOutFor(st)){ if(st==='pull') lh=[f*8,-4]; else rh=[f*9,-5]; }
  const eL=kneeOf(neck,lh,f,8),eR=kneeOf(neck,rh,f,8),kL=kneeOf(pel,lf,-f,8.6),kR=kneeOf(pel,rf,-f,8.6);
  let L=[head,neck,pel,eL,lh,eR,rh,kL,lf,kR,rf];
  if(st==='rise'){ const e=ease(clamp(p.riseT/1.4,0,1)), a=(1-e)*-1.45*f, c=Math.cos(a), s=Math.sin(a);
    L=L.map(q=>{const x=q[0],y=q[1]-22; return [x*c-y*s, y*c+x*s+22];}); }
  if(st==='pull'){ const a=clamp(Math.atan2(hook.x-p.x,-(hook.y-p.y)),-1.2,1.2), c=Math.cos(a), s=Math.sin(a);   // тело вытянуто вдоль верёвки
    L=L.map(q=>{const x=q[0],y=q[1]+22; return [x*c-y*s, y*c+x*s-22];}); }
  return L.map(q=>[p.x+q[0],p.y+q[1]]);
}
function activeSurfs(){ const a=[ground]; for(const g of grips) if(g.ledge&&g.y>cam.y-300&&g.y<cam.y+VH+900) a.push(g.surf); return a; }
function enterRag(vx,vy){
  const p=P, ragLike=p.state==='getup'||p.state==='haul';
  const base=(ragLike&&p.bodyPts)?p.bodyPts:computePose();
  p.state='fall'; p.fallA=lastAnchor; p.taut=false; p.gu=null; p.haul=null;
  if(lastAnchor.kind==='piton') p.ropeL=Math.hypot(base[2][0]-lastAnchor.g.x-2,base[2][1]-lastAnchor.g.y-11)+28;
  p.rag={p:base.map((q,i)=>({x:q[0],y:q[1],ox:q[0],oy:q[1],vx:vx+(i===2?0:rnd(-60,60)),vy:vy+(i===2?0:rnd(-60,40))})),
    t:0,settle:0,contact:false,touched:false,surf:null,pend:0,hurt:false,dents:0,soft:!!p.softFall};
  p.softFall=false;
  p.bodyPts=base.map(q=>[q[0],q[1]]);
}
function stick(a,b,len,minOnly){
  const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.0001;
  if(minOnly&&d>=len) return;
  const k=(d-len)/d*0.5; a.x+=dx*k; a.y+=dy*k; b.x-=dx*k; b.y-=dy*k;
}
function updateRag(dt){
  const p=P, R=p.rag, pts=R.p, a=p.fallA, surfs=activeSurfs();
  const h=Math.min(dt,1/30), sub=3, sdt=h/sub; R.t+=dt; R.contact=false; R.dents=0;
  for(let s=0;s<sub;s++){
    for(const q of pts){ q.ox=q.x; q.oy=q.y; q.vy+=900*sdt; q.vx*=1-0.35*sdt; q.x+=q.vx*sdt; q.y+=q.vy*sdt; }
    for(let it=0;it<6;it++){
      for(const c of RS) stick(pts[c[0]],pts[c[1]],c[2],false);
      for(const c of RMIN) stick(pts[c[0]],pts[c[1]],c[2],true);
      if(a&&a.kind==='piton'){ const pe=pts[2], ax=a.g.x+2, ay=a.g.y+11, dx=pe.x-ax, dy=pe.y-ay, d=Math.hypot(dx,dy);
        if(d>p.ropeL){ pe.x=ax+dx/d*p.ropeL; pe.y=ay+dy/d*p.ropeL;
          if(!p.taut){ p.taut=true; if(pe.vy>200){ shake=Math.max(shake,6); sfx('jerk'); } } } }
      for(let i=0;i<pts.length;i++){ const q=pts[i]; q.x=clamp(q.x,-1395,436);
        for(const sf of surfs){ if(q.x<sf.x0||q.x>sf.x1) continue; const top=sf.top(q.x)-1.2;
          if(q.y>top && q.oy<=top+7){
            if(it===0){ const v=q.vy;
              if((i===2||i===0||i===1)&&!R.hurt&&v>540){ R.hurt=true; R.pend=v>1300?3:v>880?2:1; if(R.soft&&sf===ground){ R.pend=0; sf.dent(q.x,26,8); showToast('МЯГКИЙ СУГРОБ'); } }
              if(v>140&&R.dents<4){ R.dents++; sf.dent(q.x,7,Math.min(3.5,v/220)); if(v>260) snowBurst(q.x,top,6,Math.min(160,v*0.3)); if(i===2) sfx('thud',Math.min(1,v/600)); } }
            q.y=top; q.x=lerp(q.x,q.ox,0.55); R.contact=true; R.touched=true; if(i===2||!R.surf) R.surf=sf;
          } } }
    }
    for(const q of pts){ q.vx=(q.x-q.ox)/sdt; q.vy=(q.y-q.oy)/sdt; }
  }
  p.x=pts[2].x; p.y=pts[2].y-6; p.bodyPts=pts.map(q=>[q.x,q.y]);
}
function updateFall(dt){
  const p=P,R=p.rag; updateRag(dt);
  if(R.pend){ const d=R.pend; R.pend=0; damage(d); if(scene!=='play') return; }
  let sp=0; for(const q of R.p) sp=Math.max(sp,Math.abs(q.vx)+Math.abs(q.vy));
  if(R.contact&&sp<70) R.settle+=dt; else R.settle=Math.max(0,R.settle-dt*0.5);
  if(R.surf&&R.contact&&(R.settle>0.5||R.t>5)){ startGetup(); return; }
  if(p.fallA.kind==='piton'&&!R.contact&&R.t>2.3&&(sp<260||R.t>3.6)){ startHaul(); return; }
  if(R.t>7||p.y>400){ if(p.fallA.kind==='piton') startHaul(); else { const s=p.fallA.surf;
      for(const q of R.p){ q.x=clamp(q.x,s.x0+15,s.x1-15); q.y=s.top(q.x)-2; } R.surf=s; startGetup(); } }
}
function startGetup(){
  const p=P,R=p.rag,s=R.surf; const from=p.bodyPts.map(q=>[q[0],q[1]]);
  p.f=(from[0][0]>=from[2][0])?1:-1;
  p.surf=s; p.x=clamp(R.p[2].x,s.x0+12,s.x1-12); p.y=s.top(p.x)-FEET; p.vx=0; p.step=0;
  p.state='stand'; const tc=computePose('crouch'), ts=computePose('stand');
  p.state='getup'; p.gu={t:0,from,tc,ts}; p.rag=null;
  curIdx=s.g?s.g.i:-1; lastAnchor={kind:'surf',surf:s,g:s.g||null};
}
function startHaul(){
  const p=P, g=p.fallA.g, from=p.bodyPts.map(q=>[q[0],q[1]]), sx=p.x, sy=p.y;
  p.state='hang'; p.hangG=g; p.x=g.x; p.y=g.y+24; const tgt=computePose('hang'); p.x=sx; p.y=sy;
  p.state='haul'; p.haul={t:0,from,tgt,g}; p.rag=null;
}
const lerpPts=(a,b,t)=>a.map((q,i)=>[lerp(q[0],b[i][0],t),lerp(q[1],b[i][1],t)]);

function drawBody(pts){
  const p=P,f=p.f,col='#1a2028',acc='#d3582c';
  const [head,neck,pel,eL,hL,eR,hR,kL,fL,kR,fR]=pts;
  const dx=neck[0]-pel[0], dy=neck[1]-pel[1], L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(p.hasGear){ const cx=(neck[0]+pel[0])/2-nx*f*6, cy=(neck[1]+pel[1])/2-ny*f*6;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.atan2(uy,ux)+Math.PI/2);
    ctx.fillStyle=acc; ctx.fillRect(-4,-7,8,14); ctx.fillStyle='#a9431f'; ctx.fillRect(-4,-1,8,2);
    ctx.strokeStyle='#9e2b22'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(-f*1,7,3.2,0,6.283); ctx.stroke(); ctx.restore(); }
  ctx.strokeStyle=col;
  ctx.lineWidth=3.4; for(const [k,ft] of [[kL,fL],[kR,fR]]){ ctx.beginPath(); ctx.moveTo(pel[0],pel[1]); ctx.lineTo(k[0],k[1]); ctx.lineTo(ft[0],ft[1]); ctx.stroke(); }
  ctx.lineWidth=3; for(const ft of [fL,fR]){ ctx.beginPath(); ctx.moveTo(ft[0]-f*1,ft[1]); ctx.lineTo(ft[0]+f*3,ft[1]+0.5); ctx.stroke(); }
  ctx.lineWidth=7.5; ctx.beginPath(); ctx.moveTo(pel[0],pel[1]); ctx.lineTo(neck[0],neck[1]); ctx.stroke();
  ctx.lineWidth=3; for(const [e,hh] of [[eL,hL],[eR,hR]]){ ctx.beginPath(); ctx.moveTo(neck[0]+(pel[0]-neck[0])*0.12,neck[1]+(pel[1]-neck[1])*0.12); ctx.lineTo(e[0],e[1]); ctx.lineTo(hh[0],hh[1]); ctx.stroke(); }
  if(gunOutFor(p.state)){ const ax=p.aimT>0?p.aimx:f, ay=p.aimT>0?p.aimy:0.12;
    ctx.save(); ctx.translate(hR[0],hR[1]); ctx.rotate(Math.atan2(ay,ax)); if(ax<0) ctx.scale(1,-1);     // рукоять всегда вниз
    ctx.fillStyle='#0d1014'; ctx.fillRect(-2.5,-3.4,12,3.6);
    ctx.beginPath(); ctx.moveTo(-2.2,0); ctx.lineTo(1.8,0); ctx.lineTo(0.6,5.6); ctx.lineTo(-3.2,5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#0d1014'; ctx.lineWidth=0.9; ctx.beginPath(); ctx.moveTo(2,0.2); ctx.quadraticCurveTo(4.6,0.4,4.4,2.6); ctx.lineTo(2.2,2.6); ctx.stroke();
    ctx.fillStyle='#59626c'; ctx.fillRect(-2.5,-3.4,12,0.9); ctx.fillRect(8.6,-4.3,1,1);
    if(P.laser){ ctx.fillStyle='#3a1210'; ctx.fillRect(3,0.4,4,1.6); ctx.fillStyle='#ff3c28'; ctx.fillRect(6.6,0.8,0.8,0.8); }
    ctx.restore(); }
  if(torchOutFor(p.state)){ const th=(p.state==='pull')?hL:hR, lit=p.fuel>0;
    ctx.strokeStyle='#5a3f2c'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(th[0]-f*1,th[1]+5); ctx.lineTo(th[0]+f*2,th[1]-8); ctx.stroke();
    ctx.fillStyle='#2b2019'; ctx.fillRect(th[0]+f*2-2,th[1]-11,4,4);
    if(lit){ const fx=th[0]+f*2, fy=th[1]-12, fl=1+0.25*Math.sin(T*23)+0.15*Math.sin(T*37);
      const gl=ctx.createRadialGradient(fx,fy,2,fx,fy,46); gl.addColorStop(0,'rgba(255,180,80,0.35)'); gl.addColorStop(1,'rgba(255,150,60,0)');
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(fx,fy,46,0,6.283); ctx.fill();
      ctx.fillStyle='#e8662a'; ctx.beginPath(); ctx.ellipse(fx,fy-2*fl,3.4,6*fl,Math.sin(T*9)*0.15,0,6.283); ctx.fill();
      ctx.fillStyle='#ffd27a'; ctx.beginPath(); ctx.ellipse(fx,fy-0.5,1.8,3.4*fl,0,0,6.283); ctx.fill(); } }
  const ha=Math.atan2(head[1]-neck[1],head[0]-neck[0]);
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(head[0],head[1],4.6,0,6.283); ctx.fill();
  ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(head[0],head[1],4.9,ha-Math.PI/2,ha+Math.PI/2); ctx.fill();
  ctx.beginPath(); ctx.arc(head[0]+Math.cos(ha)*6.4,head[1]+Math.sin(ha)*6.4,1.7,0,6.283); ctx.fill();
  if(p.hurtT>0&&Math.sin(T*40)>0){ ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(pel[0],(pel[1]+neck[1])/2,20,0,6.283); ctx.stroke(); }
}
function drawClimber(){
  if(P.hidden) return;
  const ragLike=P.state==='fall'||P.state==='getup'||P.state==='haul';
  drawBody(ragLike&&P.bodyPts?P.bodyPts:computePose());
}

// ================= крюк =================
function retract(){ hook.state='retract'; hook.rt=0; hook.sx=hook.x; hook.sy=hook.y; }
function onHoldStart(){
  if(scene!=='play') return;
  if(overlay==='piton'){ pitHoldStart(); return; }
  if(overlay) return;
  if(P.snake||P.inShop) return;
  const h=hook;
  if(h.state==='idle' && P.weapon==='hook' && P.hasGear && (P.state==='stand'||P.state==='hang')){
    const hp=handPos(); h.state='spin'; h.w=2.5; h.a=Math.atan2(h.y-hp.y,h.x-hp.x); h.revA=0;
  } else if(h.state==='latched'){ h.holdT=0; h.holding=true; }
}
function onHoldEnd(){
  if(scene!=='play') return;
  if(overlay==='piton'){ pitHoldEnd(); return; }
  const h=hook;
  if(h.state==='spin'){
    if(h.w>4){ const sp=150+400*(h.w/WMAX); h.vx=-Math.sin(h.a)*sp; h.vy=Math.cos(h.a)*sp; h.state='fly'; sfx('throw'); }
    else h.state='idle';
  } else if(h.state==='latched'){
    if(h.holding && h.holdT<0.16 && P.state!=='pull'){ retract(); showToast('ОТЦЕПЛЕНО'); }
    h.holding=false;
  }
}
function gripBox(g){ const hard=RUN.diff==='hard'; return {rx:g.hw+(hard?5:12),ry:hard?11:17}; }
function latchTargets(){ const r=[]; for(let i=curIdx+1;i<=curIdx+5;i++){ const g=grip(i); if(!g) break; r.push(g); if(g.ledge) break; } return r; }
function checkLatch(){
  const h=hook;
  for(const g of latchTargets()){
    if(g.ledge){ if(h.x>g.surf.x0+6&&h.x<g.surf.x1-6&&Math.abs(h.y-(g.y-3))<13){ latch(g,1,h.x,g.y-2); return; } }
    else { const hb=gripBox(g), dx=(h.x-g.x)/hb.rx, dy=(h.y-g.y)/hb.ry; if(dx*dx+dy*dy<1){ latch(g,1,g.x,g.y); return; } }
  }
}
function latch(g,q,lx,ly){
  const h=hook; h.state='latched'; h.g=g; h.q=q; h.lx=lx; h.ly=ly; h.x=lx; h.y=ly; h.holding=false;
  h.slipAt=-1;   // ненадёжного хвата больше нет
  sfx('latch'); snowBurst(lx,ly-2,8,60);
  if(!tut.latch){ tut.latch=1; showHint('Зажмите — подтянуться.  Короткое нажатие — отцепить крюк.'); }
}
// враги, к которым тянется крюк
function enemies(){
  const e=[];
  for(const q of goats) if(q.st!=='dead'&&q.st!=='reel'&&q.st!=='fall') e.push({x:q.x,y:q.y-8,r:14,kind:'goat',ref:q});
  for(const b of bats) if(b.st!=='dead') e.push({x:b.x,y:b.y,r:7,kind:'bat',ref:b});
  for(const b of birds) if(b.st!=='dead'&&b.st!=='flee'&&b.st!=='reel') e.push({x:b.x,y:b.y,r:b.r,kind:'bird',ref:b});
  for(const g of grips){ if(!g.ledge||g.y<cam.y-80||g.y>cam.y+VH+80) continue;
    for(const s of g.snakes) if(s.st==='rise'||s.st==='exposed'){ const hd=snakeHead(s); e.push({x:hd[0],y:hd[1],r:9,kind:'snake',ref:s}); } }
  return e;
}
function nearestEnemy(x,y,maxD,forHook){ let best=null; for(const e of enemies()){ if(forHook&&e.kind==='goat') continue; const d=Math.hypot(e.x-x,e.y-y); if(d<maxD&&(!best||d<best.d)){ e.d=d; best=e; } } return best; }
function hookHit(e){
  const h=hook, sp=Math.hypot(h.vx,h.vy)||1;
  if(e.kind==='bird'){ hitBird(e.ref,2,h.vx/sp,h.vy/sp); showToast('ПОПАДАНИЕ КРЮКОМ'); }
  else if(e.kind==='goat'){ showToast('КРЮК ОТСКОЧИЛ — КОЗЛА НЕ ВЗЯТЬ'); e.ref.flash=0.2; }
  else if(e.kind==='bat'){ e.ref.st='dead'; e.ref.vy=-60; feathers(e.ref.x,e.ref.y,5,'#26324a'); }
  else killSnake(e.ref,h.vx*0.3,-150);
  sfx('thud'); shake=Math.max(shake,4); retract();
}
function updateHook(dt){
  const h=hook, hp=handPos();
  if(h.state==='idle'){ h.x=P.x-P.f*2; h.y=P.y+9; }
  else if(h.state==='spin'){
    h.w=Math.min(WMAX,h.w+9*dt); const pa=h.a; h.a+=h.w*dt; h.revA+=h.a-pa;
    if(h.revA>Math.PI*2){ h.revA-=Math.PI*2; sfx('whoosh',h.w/WMAX); }
    h.x=hp.x+Math.cos(h.a)*24; h.y=hp.y+Math.sin(h.a)*24;
    if(P.state!=='stand'&&P.state!=='hang') h.state='idle';
  } else if(h.state==='fly'){
    h.vy+=HG*dt;
    // незаметный магнит к врагам
    const m=nearestEnemy(h.x,h.y,125,true);
    if(m){ const k=1-m.d/125, sp=Math.hypot(h.vx,h.vy)||1;
      h.vx+=(m.x-h.x)/m.d*1400*k*dt; h.vy+=(m.y-h.y)/m.d*1400*k*dt;
      const ns=Math.hypot(h.vx,h.vy)||1; h.vx*=sp/ns; h.vy*=sp/ns; }
    if(!m||m.d>60){ let bg=null,bd=60; for(const g of latchTargets()){ if(g.ledge) continue; const d=Math.hypot(g.x-h.x,g.y-h.y); if(d<bd){ bd=d; bg=g; } }
      if(bg){ const k=1-bd/60, sp=Math.hypot(h.vx,h.vy)||1; h.vx+=(bg.x-h.x)/bd*700*k*dt; h.vy+=(bg.y-h.y)/bd*700*k*dt;
        const ns=Math.hypot(h.vx,h.vy)||1; h.vx*=sp/ns; h.vy*=sp/ns; } }
    if(climbingWall()) h.vx+=GUST.v*380*dt;
    h.x+=h.vx*dt; h.y+=h.vy*dt;
    const e=nearestEnemy(h.x,h.y,200);
    if(e&&e.d<e.r+10){ hookHit(e); return; }
    if(!e||e.d>48) checkLatch();                 // враг рядом — приоритет ему, а не уступу
    if(h.state==='fly' && (Math.hypot(h.x-hp.x,h.y-hp.y)>ROPE || h.y>hp.y+140 || h.x<-30 || h.x>430)) retract();
  } else if(h.state==='latched'){
    h.x=h.lx; h.y=h.ly;
    if(h.holding && input.hold && !overlay){ h.holdT+=dt; if(h.holdT>0.16 && (P.state==='stand'||P.state==='hang')) startPull(); }
  } else if(h.state==='retract'){
    h.rt+=dt*3; const t=Math.min(1,h.rt); h.x=lerp(h.sx,hp.x,t); h.y=lerp(h.sy,hp.y,t)-Math.sin(t*Math.PI)*10;
    if(h.rt>=1) h.state='idle';
  }
}
function startAir(vy){ const p=P; p.airSurf=p.surf; p.softFall=!!(p.surf&&p.surf.g&&p.surf.g.k===1); p.state='air'; p.vy=vy; p.airY0=p.y; }
function jump(){
  const p=P; if(p.inShop) return; if(scene!=='play'||overlay||p.state!=='stand'||p.snake||hook.state==='latched'||hook.state==='spin'||hook.state==='fly') return;
  p.surf.dent(p.x-3,6,2.5); p.surf.dent(p.x+3,6,2.5); snowBurst(p.x,p.y+FEET,8,60); sfx('step'); startAir(-290);
}
function startPull(){ const p=P; p.pullFromG=p.state==='hang'?p.hangG:null; p.pullSurf=p.state==='stand'?p.surf:null; p.state='pull';
  p.pullFrom={x:p.x,y:p.y}; p.pullTo={x:hook.lx,y:hook.ly+24}; p.pullP=0;
  p.pullLen=Math.hypot(p.pullTo.x-p.x,p.pullTo.y-p.y);
  p.L0=Math.max(24,Math.hypot(p.x-hook.lx,p.y-hook.ly)); p.th=Math.atan2(p.x-hook.lx,p.y-hook.ly); p.thV=0; p.windRoll=0.3; }
function slip(){ sfx('jerk'); showToast('КРЮК СОРВАЛСЯ'); snowBurst(hook.lx,hook.ly,10,80); retract(); startFall(rnd(-40,40),-20); }
function arrive(g){
  const p=P; hook.state='idle'; curIdx=g.i; if(overlay==='piton'){ pit.g.pp=pit.prog; overlay=null; }
  if(g.ledge){ p.state='stand'; p.surf=g.surf; p.x=clamp(hook.lx,g.surf.x0+15,g.surf.x1-15); p.y=g.surf.top(p.x)-FEET; p.vx=0;
    g.surf.dent(p.x-3,6,3); g.surf.dent(p.x+4,6,3); snowBurst(p.x,p.y+FEET,10,70); reachLedge(g); }
  else { p.state='hang'; p.hangG=g; p.x=g.x; p.y=g.y+24; if(!g.piton) openPiton(); }
}
function reachLedge(g){
  const p=P; p.ledgeK=Math.max(p.ledgeK,g.k); lastAnchor={kind:'surf',surf:g.surf,g}; p.health=3; save();
  showToast('УСТУП '+g.k+' · СОХРАНЕНО');
  if(g.summit) showHint('ВЕРШИНА! Подберите сигнальный фальшфейер в центре и зажгите его.',9);
  else if(g.tent && !p.hasPistol) showHint('На уступе палатка. Загляните внутрь.');
  else if(g.med && !p.taken.includes('m'+g.k)) showHint('Здесь брошенная аптечка. Подберите её.');
  else if(g.torch && !p.hasTorch) showHint('Становится холоднее. У костра лежит факел — подберите его.',8);
  else if(g.hut && !tut.hut){ tut.hut=1; showHint('На уступе лавка — они будут на каждом втором уступе. Подойдите к двери и нажмите ВОЙТИ (E). Торговец берёт тушки птиц и змей.',9); }
  else if(g.k===3 && !tut.snk){ tut.snk=1; showHint('Осторожно: дальше в снегу на уступах прячутся змеи. Следите за шевелящимся снегом.',9); }
  else if(g.crate && !p.taken.includes('c'+g.k)) showHint('Здесь ящик — там могут быть припасы.',5);
}

// ================= падение / урон =================
function startFall(vx,vy,knock){
  const p=P; if(p.state==='fall') return;
  if(hook.state!=='idle'&&hook.state!=='retract') retract();
  if(overlay==='piton') pit.g.pp=pit.prog;
  if(overlay&&overlay!=='inv') overlay=null;
  if(p.snake) detachSnake();
  enterRag(vx===undefined?rnd(-30,30):vx, vy===undefined?-30:vy);
  if(!knock) showToast('СРЫВ!'); shake=Math.max(shake,4);
}
function damage(n){
  const p=P; p.health-=n; p.hurtT=0.5; flash=Math.max(flash,0.5); shake=Math.max(shake,6); sfx('hit');
  if(p.health<=0 && scene==='play'){
    if(p.inShop) exitShop();
    if(p.state!=='fall'){ if(p.snake) detachSnake(); if(hook.state!=='idle') retract(); enterRag(rnd(-40,40),-60); }
    scene='dead'; deadT=0; overlay=null;
  }
}

// ================= подборы =================
function pickups(){
  const p=P;
  if(!p.hasGear && p.surf===ground && Math.abs(p.x-GEAR_X)<14){
    p.hasGear=true; sfx('pick'); snowBurst(GEAR_X,-4,14,70); invSync(); save();
    showToast('СНАРЯЖЕНИЕ СКАЛОЛАЗА');
    showHint('Подойдите к скале. Зажмите экран (или Пробел) — раскрутить крюк, отпустите — бросок. I — снаряжение.',10);
  }
  const g=p.surf&&p.surf.g; if(!g) return;
  if(g.tent && !p.hasPistol && Math.abs(p.x-g.tentX)<18){
    p.hasPistol=true; p.mag=7; p.mags=Math.max(p.mags,1); sfx('pick'); invSync(); save();
    showToast('ПИСТОЛЕТ И МАГАЗИН');
    showHint('Q / кнопка — крюк или пистолет. Тап/клик — выстрел. R — перезарядка. I — снаряжение (пауза).',10);
  }
  if(g.med && !p.taken.includes('m'+g.k) && Math.abs(p.x-g.medX)<14){
    p.taken.push('m'+g.k); p.syr+=2; sfx('pick'); snowBurst(g.medX,g.y-6,10,60); invSync(); save();
    showToast('+2 ШПРИЦА С ПРОТИВОЯДИЕМ');
  }
  if(g.torch && !p.hasTorch && Math.abs(p.x-g.torchX)<14){
    p.hasTorch=true; p.fuel=1; sfx('pick'); invSync(); save(); showToast('ФАКЕЛ');
    showHint('Факел. В сильный ледяной ветер холод отнимает здоровье — выберите факел на поясе (кнопка или клавиша). У костров на уступах он пополняется, а вы греетесь.',10);
  }
  if(g.crate && !p.taken.includes('c'+g.k) && Math.abs(p.x-g.crateX)<14){
    const n=g.k%3===0?2:1, s=g.k>=3&&hash(g.i*4.4)<0.5?1:0; p.taken.push('c'+g.k); p.mags+=n; p.syr+=s;
    sfx('pick'); snowBurst(g.crateX,g.y-6,10,60); invSync(); save();
    showToast('+'+n+' МАГАЗИН'+(n>1?'А':'')+(s?' · +1 ШПРИЦ':''));
  }
}

// ================= игрок =================
function updatePlayer(dt){
  const p=P;
  p.gunCD=Math.max(0,p.gunCD-dt); p.hurtT=Math.max(0,p.hurtT-dt); p.aimT=Math.max(0,p.aimT-dt);
  if(p.poisoned||p.snake){ p.venom+=dt/(p.snake?5:16); if(p.venom>=1){ p.venom=0; showToast('ЯД'); damage(1); if(scene!=='play') return; } }
  if(p.state==='stand'){
    let mv=(input.left?-1:0)+(input.right?1:0); if(overlay||hook.state==='latched'||p.snake) mv=0;
    p.vx=lerp(p.vx,mv*72,Math.min(1,dt*10)); if(mv) p.f=mv;
    const nx=p.x+p.vx*dt;
    if(p.surf.g&&(nx<p.surf.x0+3||nx>p.surf.x1-3)){ p.x=nx; startAir(0); return; }   // шагнули за край уступа
    const mg=p.surf.g?0:12; p.x=clamp(nx,p.surf.x0+mg,p.surf.x1-mg); p.y=p.surf.top(p.x)-FEET;
    if(Math.abs(p.vx)>6){ p.step+=Math.abs(p.vx)*dt/13; const ph=Math.floor(p.step);
      if(ph!==p.lastFoot){ p.lastFoot=ph; const fx=p.x+p.f*4+(ph%2?2:-2);
        p.surf.dent(fx,5,2.3); sfx('step');
        if(!p.surf.shop) for(let i=0;i<3;i++) addP(fx,p.surf.top(fx),rnd(-25,25)+p.vx*0.3,rnd(-45,-15),rnd(0.3,0.6),rnd(0.8,1.6),'#fff',350); } }
    else p.step=Math.floor(p.step)+lerp(p.step%1,0,dt*8);
    pickups();
  } else if(p.state==='hang'){ const g=p.hangG; p.x=g.x+Math.sin(T*1.3)*1.2+sway; p.y=g.y+24-Math.abs(sway)*0.12; }
  else if(p.state==='pull'){
    const h=hook;
    const L=lerp(p.L0,24,p.pullP), strong=Math.abs(GUST.v)>=STRONG;
    if(input.hold && h.holding && !overlay){
      if(strong && windUnsafe()){ p.windRoll-=dt; if(p.windRoll<=0){ p.windRoll=0.3;      // лезть дальше в сильный ветер — высокий шанс сорваться
          if(Math.random()<clamp(0.14+L/300,0.14,0.6)){ showToast('СДУЛО ВЕТРОМ'); slip(); return; } } }
      p.pullP=Math.min(1,p.pullP+115*dt/Math.max(30,p.pullLen)); }
    // маятник: тело висит на верёвке, ветер тем сильнее сносит, чем ниже (длиннее верёвка)
    const wa=climbingWall()||p.y<-60?GUST.v*300:0;
    p.thV+=(-(900/L)*Math.sin(p.th)+wa*Math.cos(p.th)/L-p.thV*1.3)*dt; p.th+=p.thV*dt;
    p.x=h.lx+Math.sin(p.th)*L; p.y=h.ly+Math.cos(p.th)*L;
    if(p.pullSurf&&p.x>p.pullSurf.x0&&p.x<p.pullSurf.x1){ const top=p.pullSurf.top(p.x)-FEET; if(p.y>top){ p.y=top; p.thV*=0.5; p.th=Math.atan2(p.x-h.lx,p.y-h.ly); } }
    if(p.pullP>=1) arrive(h.g);
  } else if(p.state==='air'){
    const mv=(input.left?-1:0)+(input.right?1:0); if(mv) p.f=mv;
    p.vx=lerp(p.vx,mv*80,Math.min(1,dt*3)); const py0=p.y;
    p.vy+=900*dt; p.x=clamp(p.x+p.vx*dt,-1395,436); p.y+=p.vy*dt;
    if(p.vy>0){ for(const sf of activeSurfs()){ if(p.x<sf.x0+3||p.x>sf.x1-3) continue; const top=sf.top(p.x);
        if(py0+FEET<=top+2&&p.y+FEET>=top){ p.state='stand'; p.surf=sf; p.y=top-FEET; p.vy=0; p.softFall=false; sf.dent(p.x-3,6,3); sf.dent(p.x+4,6,3);
          snowBurst(p.x,top,10,70); sfx('step'); sfx('thud',0.4);
          if(sf!==p.airSurf){ curIdx=sf.g?sf.g.i:-1; lastAnchor={kind:'surf',surf:sf,g:sf.g||null}; } return; } } }
    if(p.y-p.airY0>55) startFall(p.vx,p.vy,true);       // летим вниз — превращаемся в рэгдолл
  } else if(p.state==='fall') updateFall(dt);
  else if(p.state==='getup'){
    const G=p.gu; G.t=Math.min(1,G.t+dt/1.15);
    p.bodyPts=G.t<0.5?lerpPts(G.from,G.tc,ease(G.t/0.5)):lerpPts(G.tc,G.ts,ease((G.t-0.5)/0.5));
    if(G.t>=1){ p.state='stand'; p.gu=null; }
  } else if(p.state==='haul'){
    const H=p.haul; H.t=Math.min(1,H.t+dt/1.3); p.bodyPts=lerpPts(H.from,H.tgt,ease(H.t));
    p.x=p.bodyPts[2][0]; p.y=p.bodyPts[2][1]-6;
    if(H.t>=1){ p.state='hang'; p.hangG=H.g; curIdx=H.g.i; p.haul=null; }
  }
}

    tip:'Беркут — обычный противник: 2 попадания.'},

    tip:'Гриф — огромный и живучий (3 попадания), зато медленный. Крюк его не убивает сразу.'}
};
function pickBirdType(){ const k=P.ledgeK, r=Math.random(); if(k>=4&&r<0.25) return 'vulture'; if(k>=2&&r<0.36) return 'raven'; return 'eagle'; }
function spawnBird(type){
  type=type||pickBirdType(); const d=BT[type], side=Math.random()<0.5?-1:1;
  birds.push({type,x:side<0?-70:470,y:P.y-rnd(60,190),vx:0,vy:0,st:'approach',t:0,hp:d.hp,ph:rnd(6),seed:rnd(10),
    oa:side<0?Math.PI*1.1:-0.1,cr:rnd(130,165),ct:type==='raven'?rnd(1.5,3):rnd(3,5.5),dir:rnd()<0.5?-1:1,f:-side,hitT:0,r:11*d.sc,rot:0,dx:0,dy:1,sp:0});
  sfx(d.cry,0.5);
  if(!tut['b_'+type]){ tut['b_'+type]=1; showHint((tut.bird?'':'Огромная птица! Стреляйте — или раскрутите крюк, когда она бросится в атаку. ')+d.tip,9); tut.bird=1; }
}
function canReel(){ return scene==='play'&&!P.inShop&&P.hasGear&&P.state!=='fall'&&P.state!=='haul'; }
function killBird(b,vx,vy){ b.st='dead'; b.vx=vx; b.vy=vy; b.rot=0; b.t=0; b.reel=canReel(); feathers(b.x,b.y,16,BT[b.type].feather); }
function hitBird(b,dmg,dx,dy){ b.hp-=dmg; b.hitT=0.15; b.x+=dx*6; b.y+=dy*6; feathers(b.x,b.y,6,BT[b.type].feather);
  if(b.hp<=0) killBird(b,dx*150,-60); else { b.st='flee'; b.t=0; } }
function hitPlayer(b){
  b.st='flee'; b.t=0; const p=P;
  if(p.state==='fall'||p.state==='haul') return;
  feathers(p.x,p.y,4,'#1a2028'); damage(1); if(scene!=='play') return;
  const knock=p.state==='stand'||p.state==='getup';
  startFall(b.dx*260,b.dy*140-170,knock);
  if(!tut.rag){ tut.rag=1; showHint('Птица сбила вас. Вбитый крюк удержит на верёвке.',6); }
}
function updateBirds(dt){
  const p=P;
  if(p.hasPistol && p.y<-150 && p.state!=='fall' && !FIN){
    birdTimer-=dt;
    if(birdTimer<=0){ const alive=birds.filter(b=>b.st!=='dead').length, maxB=1+Math.min(1,Math.floor(p.ledgeK/4));
      if(alive<maxB) spawnBird(); birdTimer=rnd(24,36)-Math.min(6,p.ledgeK*0.5); }
  }
  const hp=handPos();
  for(const b of birds){
    const d=BT[b.type];
    b.ph+=dt*(b.st==='dive'?3:b.st==='flee'?d.flapRate*1.4:d.flapRate); b.hitT=Math.max(0,b.hitT-dt); b.t+=dt;
    const px=p.x, py=p.y-4;
    if(b.st!=='dead'&&b.st!=='flee'&&b.st!=='reel'){
      const h=hook;
      let under=false; if(h.state==='spin'&&h.w>6){ for(let k=0;k<5;k++){ const a=h.a-h.w*dt*k/4; if(Math.hypot(hp.x+Math.cos(a)*24-b.x,hp.y+Math.sin(a)*24-b.y)<b.r*0.75+5){ under=true; break; } } }
      if(under){
        hitBird(b,2,b.x<px?-1:1,-0.4); if(b.st==='dead'){ b.vx=b.x<px?-220:220; b.vy=-120; }
        sfx('thud'); shake=Math.max(shake,4); showToast('ПОПАДАНИЕ КРЮКОМ'); continue; }
    }
    if(b.st==='approach'||b.st==='circle'){

function drawWing(c,beta,fold,alpha,ox,oy,white){
  const S=[3+ox,-3+oy], L1=15*(1-fold*0.35), L2=21*(1-fold*0.5);
  let u=[-Math.cos(beta)*0.6-0.4,-Math.sin(beta)]; let ul=Math.hypot(u[0],u[1]); u=[u[0]/ul,u[1]/ul];
  const b2=beta*1.15-fold*0.5; let u2=[-Math.cos(b2)*0.75-0.25,-Math.sin(b2)]; ul=Math.hypot(u2[0],u2[1]); u2=[u2[0]/ul,u2[1]/ul];
  let n=[u[1],-u[0]]; if(n[0]>0) n=[-n[0],-n[1]];
  let n2=[u2[1],-u2[0]]; if(n2[0]>0) n2=[-n2[0],-n2[1]];
  const W=[S[0]+u[0]*L1,S[1]+u[1]*L1], Tp=[W[0]+u2[0]*L2,W[1]+u2[1]*L2];
  ctx.globalAlpha=alpha; ctx.fillStyle=white?'#fff':c.wing;
  ctx.beginPath(); ctx.moveTo(S[0]+4,S[1]+1); ctx.quadraticCurveTo((S[0]+W[0])/2-n[0]*2,(S[1]+W[1])/2-n[1]*2,W[0],W[1]);

  for(let k=0;k<6;k++){ const f0=k*0.16, B=[lerp(Tp[0],W[0],f0),lerp(Tp[1],W[1],f0)];
    const tip=[B[0]+u2[0]*(4-k*0.6)+n2[0]*(4+k*1.5),B[1]+u2[1]*(4-k*0.6)+n2[1]*(4+k*1.5)];
    const notch=[lerp(Tp[0],W[0],f0+0.08)+n2[0]*(2+k*1.3),lerp(Tp[1],W[1],f0+0.08)+n2[1]*(2+k*1.3)];
    ctx.lineTo(tip[0],tip[1]); ctx.lineTo(notch[0],notch[1]); }
  const Wt=[W[0]+n2[0]*10,W[1]+n2[1]*10], St=[S[0]-6+n[0]*8,S[1]+n[1]*8];
  ctx.lineTo(Wt[0],Wt[1]);
  for(let k=1;k<=4;k++){ const t=k/4, q=[lerp(Wt[0],St[0],t),lerp(Wt[1],St[1],t)], m=[lerp(Wt[0],St[0],t-0.125)+n[0]*2,lerp(Wt[1],St[1],t-0.125)+n[1]*2];
    ctx.quadraticCurveTo(m[0],m[1],q[0],q[1]); }
  ctx.closePath(); ctx.fill();
  if(!white){
    ctx.fillStyle=c.covert; ctx.beginPath(); ctx.moveTo(S[0]+3,S[1]); ctx.lineTo(W[0],W[1]); ctx.lineTo(W[0]+n[0]*5,W[1]+n[1]*5); ctx.lineTo(S[0]-4+n[0]*5,S[1]+n[1]*5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=0.6; ctx.beginPath();
    for(let k=0;k<5;k++){ const B=[lerp(Tp[0],W[0],k*0.16+0.04),lerp(Tp[1],W[1],k*0.16+0.04)]; ctx.moveTo(B[0],B[1]); ctx.lineTo(B[0]+n2[0]*(3+k),B[1]+n2[1]*(3+k)); }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function shoot(wx,wy){
  const p=P; if(overlay||!p.hasPistol||p.state!=='stand'&&p.state!=='hang'||p.gunCD>0||p.snake) return;
  p.gunCD=0.22;
  if(p.laser){ const e=nearestEnemy(wx,wy,75); if(e){ wx=e.x; wy=e.y; } }       // лазер доводит выстрел
  const sx=p.x+p.f*4, sy=p.y-10; let dx=wx-sx, dy=wy-sy; const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
  p.f=dx<0?-1:1; p.aimT=0.8; p.aimx=dx; p.aimy=dy;
  if(p.mag<=0){ sfx('click'); showToast(p.mags>0?'ПУСТО · R — ПЕРЕЗАРЯДКА':'НЕТ ПАТРОНОВ'); return; }
  p.mag--; sfx('shot'); shake=Math.max(shake,2);
  let best=null, bt=Math.min(600,L); const tol=P.laser?18:5;
  for(const e of enemies()){ const rx=e.x-sx, ry=e.y-sy, t=rx*dx+ry*dy; if(t<0||t>600) continue;
    const qx=rx-dx*t, qy=ry-dy*t; if(qx*qx+qy*qy<(e.r+tol)*(e.r+tol) && (!best||t<bt)){ best=e; bt=t; } }
  tracer={x1:sx+dx*10,y1:sy+dy*10,x2:sx+dx*bt,y2:sy+dy*bt,t:0.08};
  for(let i=0;i<5;i++) addP(sx+dx*12,sy+dy*12,dx*rnd(40,120)+rnd(-20,20),dy*rnd(40,120)+rnd(-20,20),0.15,1.5,'#ffd9a0',0,'spark');
  if(best){ if(best.kind==='bird') hitBird(best.ref,1,dx,dy); else if(best.kind==='goat') hitGoat(best.ref,dx); else if(best.kind==='bat'){ best.ref.st='dead'; best.ref.vy=-60; feathers(best.ref.x,best.ref.y,5,'#26324a'); } else killSnake(best.ref,dx*120,-120); }
  else for(let i=0;i<5;i++) addP(sx+dx*bt,sy+dy*bt,rnd(-40,40),rnd(-40,10),rnd(0.3,0.6),1.4,'#d9dee3',300);
  if(p.mag===0 && !tut.reload){ tut.reload=1; showHint('Магазин пуст. R / кнопка ПЕРЕЗ. — сменить магазин.'); }
}

function pitGeom(q){ const rx=232, py=128, L=72, exposed=L*(1-q.prog*0.82), hx=rx-exposed;

function updatePiton(dt){

// --- перезарядка ---
const MAGW=24, MAGH=70, MAGX=81, SEATY=96, WELLY=158;

  if(!P.hasPistol||overlay||scene!=='play'||P.snake) return;
  if(P.mags<=0){ sfx('click'); showToast('НЕТ ЗАПАСНЫХ МАГАЗИНОВ'); return; }
  if(P.mag>=7){ showToast('МАГАЗИН ПОЛОН'); return; }

}
function relDown(pt){
  const l=local(pt), r=rel;

  if(r.step==='eject' && l.x>MAGX-14&&l.x<MAGX+MAGW+14&&l.y>SEATY+r.oldY-10&&l.y<SEATY+r.oldY+MAGH+18){ r.drag={k:'old',sy:l.y,y0:r.oldY}; return 'drag'; }
  if(r.step==='insert' && l.x>r.nx-14&&l.x<r.nx+MAGW+14&&l.y>r.ny-10&&l.y<r.ny+MAGH+10){ r.drag={k:'new',ox:l.x-r.nx,oy:l.y-r.ny}; return 'drag'; }
  return 'none';
}
function relMove(pt){
  const r=rel; if(!r||!r.drag) return; const l=local(pt);
  if(r.drag.k==='old'){ r.oldY=clamp(r.drag.y0+(l.y-r.drag.sy),0,80); if(r.oldY>38) dropOld(); }
  else moveNew(l.x-r.drag.ox,l.y-r.drag.oy);

  const r=rel;

  else if(Math.abs(tx-MAGX)<14 && ty>WELLY-14 && ty<WELLY+40){ r.onRail=true; tx=MAGX; sfx('click'); }
  else if(tx>MAGX-30&&tx<MAGX+40&&ty<WELLY&&ty+MAGH>80) ty=WELLY;
  r.nx=clamp(tx,6,WIN.w-MAGW-6); r.ny=clamp(ty,30,WIN.h-MAGH-6+40);

  const r=rel;

const INV={w:320,h:506};
function invXY(){ return {x:(VW-INV.w)/2,y:Math.max(40,(VH-INV.h)/2-20)}; }
function invCell(i){ if(i<6) return {x:20+i*47.6,y:142,w:42,h:42}; const j=i-6,c=j%4,r=(j/4)|0; return {x:20+c*72,y:206+r*70,w:64,h:62}; }

function invSync(){
  const want=[]; if(P.hasGear) want.push('hook'); if(P.hasPistol) want.push('gun'); if(P.hasTorch) want.push('torch'); if(P.syr>0) want.push('syr'); if(P.meds>0) want.push('med'); if(P.mags>0) want.push('mag'); if(P.carcB>0) want.push('carcB'); if(P.carcS>0) want.push('carcS'); if(P.carcG>0) want.push('carcG');

function invCount(it){ return it==='mag'?P.mags:it==='syr'?P.syr:it==='med'?P.meds:it==='carcB'?P.carcB:it==='carcS'?P.carcS:it==='carcG'?P.carcG:0; }

function invAction(id){
  const it=P.inv[inv.sel];

function invHitCell(l){ for(let i=0;i<18;i++){ const c=invCell(i); if(l.x>=c.x&&l.x<=c.x+c.w&&l.y>=c.y&&l.y<=c.y+c.h) return i; } return -1; }
const inR=(l,b)=>l.x>=b.x&&l.x<=b.x+b.w&&l.y>=b.y&&l.y<=b.y+b.h;
function invDown(pt){
  const l=local(pt,invXY());

  const i=invHitCell(l); if(i<0) return 'none';

}
function invMove(pt){ if(!inv||!inv.press) return; const l=local(pt,invXY()); inv.dx=l.x; inv.dy=l.y;
  if(!inv.drag&&Math.hypot(l.x-inv.press.x,l.y-inv.press.y)>8&&P.inv[inv.press.i]) inv.drag=true; }
function invUp(pt){

}

  else if(it==='carcG'){ ctx.beginPath(); ctx.ellipse(0,4,7,9,0,0,6.283); ctx.fill(); ctx.beginPath(); ctx.moveTo(-4,-3); ctx.quadraticCurveTo(-12,-14,-14,-2); ctx.moveTo(4,-3); ctx.quadraticCurveTo(12,-14,14,-2); ctx.stroke(); ctx.fillStyle='#000'; ctx.fillRect(-3,2,2,2); ctx.fillRect(1,2,2,2); }

  else if(it==='torch'){ ctx.strokeStyle='#c9a27a'; ctx.lineWidth=3; ctx.moveTo(-6,16); ctx.lineTo(4,-6); ctx.stroke(); ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.ellipse(6,-12,5,8,0.4,0,6.283); ctx.fill(); ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.ellipse(6,-10,2.2,4,0.4,0,6.283); ctx.fill(); }
  else if(it==='hammer'){ ctx.rotate(0.6); ctx.moveTo(0,-8); ctx.lineTo(0,18); ctx.stroke(); ctx.fillRect(-12,-16,24,8); }

// ================= лавка торговца (мини-мир) =================
const SHOP_ITEMS=[{id:'med',n:'Аптечка',d:'Полностью лечит и снимает яд',price:6},
  {id:'mag',n:'Магазин патронов',d:'Полный магазин на 7 патронов',price:5},
  {id:'laser',n:'Лазерный прицел',d:'Луч на пистолете, выстрел сам доводится до цели',price:14}];
const shopFloor=()=>VH*0.64, DOORX=74, COUNTERX=262;
const SHOP_SURF={x0:62,x1:338,g:null,shop:true,top:()=>shopFloor(),dent(){},update(){},draw(){}};
let shopT=0, sellerLine='', sellerT=0, shopW=null;
function nearHut(){ const g=P.surf&&P.surf.g; return g&&g.hut&&P.state==='stand'&&Math.abs(P.x-g.hutX+11)<14; }
function enterShop(){
  const g=P.surf.g; P.outX=g.hutX-11; P.outSurf=P.surf; P.inShop=true; hook.state='idle'; P.weapon=P.weapon;
  P.surf=SHOP_SURF; P.x=DOORX+10; P.y=shopFloor()-FEET; P.vx=0; P.f=1; shopT=0; sfx('click'); sfx('step');
  say(P.carcB+P.carcS>0?'О, гость. Тушки принёс? Тогда поговорим.':'Без тушек тут не торгуют. Иди, поохоться.');
}
function exitShop(){ const s=P.outSurf; P.inShop=false; P.surf=s; P.x=P.outX; P.y=s.top(P.x)-FEET; P.vx=0; sfx('click'); showToast('УСТУП '+s.g.k); }
function say(t){ sellerLine=t; sellerT=4; }
function interact(){
  if(overlay||scene!=='play') return false;
  if(P.inShop){ if(P.x<DOORX+24){ exitShop(); return true; } if(P.x>COUNTERX-40){ openShopWin(); return true; } return false; }
  if(nearHut()){ enterShop(); return true; }
  return false;
}
function openShopWin(){ overlay='shop'; shopW={msg:'',msgT:0}; }
function carcTotal(){ return P.carcB+P.carcS+3*P.carcG; }
function buy(it){
  const owned=it.id==='laser'&&P.laser;
  if(owned){ shopW.msg='Прицел уже стоит на пистолете'; shopW.msgT=2; return; }
  if(it.id==='laser'&&!P.hasPistol){ shopW.msg='Сперва найди пистолет'; shopW.msgT=2; return; }
  if(carcTotal()<it.price){ shopW.msg='Не хватает тушек: нужно '+it.price; shopW.msgT=2; sfx('click'); say('Дёшево не отдам. Мне тоже жить на этой горе.'); return; }

    else if(G.ph==='fade'){ G.target=G.dir*0.85*(G.t/1.5)*0.6; if(G.t<=0){ G.ph='calm'; G.t=9-k*0.6; } } }

  else { drawSky(); drawFlakes(false); drawWorld(); drawFlakes(true); }
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.3,VW/2,VH/2,VH*0.75); vg.addColorStop(0,'rgba(10,14,20,0)'); vg.addColorStop(1,'rgba(10,14,20,0.28)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  if(P&&(P.poisoned||P.snake)&&scene!=='menu'){ const a=0.18+0.12*Math.sin(T*4);
    const pg=ctx.createRadialGradient(VW/2,VH/2,VH*0.25,VW/2,VH/2,VH*0.7); pg.addColorStop(0,'rgba(40,70,30,0)'); pg.addColorStop(1,'rgba(40,70,30,'+a.toFixed(2)+')'); ctx.fillStyle=pg; ctx.fillRect(0,0,VW,VH); }
  if(scene==='play'&&!P.inShop&&P.cold>0){ const a=clamp(P.cold/2.5,0,1)*0.55;
    const fg=ctx.createRadialGradient(VW/2,VH/2,VH*0.25,VW/2,VH/2,VH*0.72); fg.addColorStop(0,'rgba(220,240,255,0)'); fg.addColorStop(1,'rgba(220,240,255,'+a.toFixed(2)+')'); ctx.fillStyle=fg; ctx.fillRect(0,0,VW,VH); }
  if(scene==='play'){ drawHUD(); drawButtons(); drawHotbar();
    if(overlay==='piton') drawPiton(); else if(overlay==='reload') drawReload(); else if(overlay==='snake') drawSnakeMini(); else if(overlay==='inject') drawInject(); else if(overlay==='inv') drawInv(); else if(overlay==='shop') drawShopWin(); else if(overlay==='flare') drawFlareMini(); }
  else if(scene==='cut') drawCutUI(); else if(scene==='menu') drawMenu(); else if(scene==='dead'){ drawHUD(); drawDead(); } else if(scene==='over') drawOver(); else if(scene==='win') drawWinScreen();
  if(flash>0){ ctx.fillStyle='rgba(255,255,255,'+(flash*0.8).toFixed(2)+')'; ctx.fillRect(0,0,VW,VH); }
}

// ================= ввод =================
const ptrs=new Map(); let holdPtr=0, holdKey=false, keyL=false, keyR=false, btnL=0, btnR=0;
function syncInput(){ input.left=keyL||btnL>0; input.right=keyR||btnR>0;
  const h=holdPtr>0||holdKey; if(h&&!input.hold){ input.hold=true; onHoldStart(); } else if(!h&&input.hold){ input.hold=false; onHoldEnd(); } }
function toLogical(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH}; }
const inBox=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
function pressBtn(id){
  if(id==='L') btnL++; else if(id==='R') btnR++;
  else if(id==='J') jump(); else if(id==='ACT') interact(); else if(id==='W') toggleWeapon(); else if(id==='RL') openReload(); else if(id==='PT') openPiton(); else if(id==='INV') openInv();
}
function weapons(){ const w=['hook']; if(P.hasPistol) w.push('gun'); if(P.hasTorch) w.push('torch'); return w; }
function setWeapon(it){ if(hook.state==='spin') hook.state='idle'; P.weapon=it; const i=P.inv.indexOf(it); if(i>=0&&i<6) P.hsel=i; sfx('click'); }
function toggleWeapon(){ const w=weapons(); if(w.length<2||hook.state==='spin'||P.snake) return; setWeapon(w[(w.indexOf(P.weapon)+1)%w.length]); }
function selectHot(i){
  if(scene!=='play'||overlay&&overlay!=='inv') return; P.hsel=i; const it=P.inv[i]; if(!it){ sfx('click'); return; }
  if(ITEMS[it].eq){ setWeapon(it); return; }
  if(it==='syr') openInject(); else if(it==='mag') openReload(); else if(it==='med'){ P.meds--; P.health=3; P.poisoned=false; P.venom=0; sfx('pick'); showToast('ЗДОРОВЬЕ ВОССТАНОВЛЕНО'); invSync(); save(); }
  else if(it==='hammer'){ if(P.state==='hang'&&P.hangG&&!P.hangG.piton) openPiton(); else showToast('НЕЧЕГО ЗАБИВАТЬ'); }
  else showToast(ITEMS[it].n.toUpperCase());
}
const HB={n:6,cell:46,gap:4}; function hotRect(i){ const w=HB.n*HB.cell+(HB.n-1)*HB.gap, x0=(VW-w)/2; return {x:x0+i*(HB.cell+HB.gap),y:VH-HB.cell-8,w:HB.cell,h:HB.cell}; }
function drawHotbar(){
  if(!P.hasGear) return;
  for(let i=0;i<HB.n;i++){ const r=hotRect(i), it=P.inv[i], held=it&&it===P.weapon, sel=i===P.hsel;
    ctx.fillStyle='rgba(0,0,0,'+(sel?0.75:0.5)+')'; ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle='#fff'; ctx.lineWidth=sel?3:1.2; ctx.globalAlpha=sel?1:0.7; ctx.strokeRect(r.x+(sel?1.5:0.6),r.y+(sel?1.5:0.6),r.w-(sel?3:1.2),r.h-(sel?3:1.2)); ctx.globalAlpha=1;
    if(it){ drawIcon(it,r.x+r.w/2,r.y+r.h/2,0.62); const n=invCount(it); ctx.fillStyle='#fff';
      if(n){ ctx.font='700 9px '+FONT; ctx.textAlign='right'; ctx.fillText(n,r.x+r.w-4,r.y+r.h-4); }
      if(held){ ctx.fillRect(r.x+8,r.y+r.h-3,r.w-16,2); }
      if(it==='torch'){ ctx.fillStyle='#ffb347'; ctx.fillRect(r.x+4,r.y+r.h-7,(r.w-8)*P.fuel,2); } }
    ctx.fillStyle='#fff'; ctx.globalAlpha=0.55; ctx.font='7px '+FONT; ctx.textAlign='left'; ctx.fillText(i+1,r.x+3,r.y+9); ctx.globalAlpha=1; }
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); audioInit(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} cv.focus&&cv.focus();
  const pt=toLogical(e);
  if(scene==='menu'){ for(const b of menuButtons()) if(inBox(pt,b)){ menuClick(b.id); break; } return; }
  if(scene==='cut'){ skipCut(); return; }
  if(scene==='dead'){ if(deadT>1.8) respawn(); return; }
  if(scene==='over'||scene==='win'){ if(overT>1){ scene='menu'; menuMode='main'; } return; }
  if(overlay==='inv'){ ptrs.set(e.pointerId,{role:invDown(pt)}); return; }
  if(overlay==='shop'){ ptrs.set(e.pointerId,{role:shopDown(pt)}); return; }
  if(overlay==='flare'){ ptrs.set(e.pointerId,{role:flareDown(pt)}); return; }
  if(overlay==='reload'){ ptrs.set(e.pointerId,{role:relDown(pt)}); return; }
  if(overlay==='snake'){ ptrs.set(e.pointerId,{role:snDown(pt)}); return; }
  if(overlay==='inject'){ const r=injDown(pt); ptrs.set(e.pointerId,{role:r}); if(r==='hold'){ holdPtr++; syncInput(); } return; }
  if(overlay==='piton'){ const l=local(pt);
    if(inClose(l,WIN.w)){ pit.g.pp=pit.prog; overlay=null; ptrs.set(e.pointerId,{role:'none'}); return; }
    ptrs.set(e.pointerId,{role:'hold'}); holdPtr++; syncInput(); return; }
  if(P.hasGear) for(let i=0;i<HB.n;i++) if(inBox(pt,hotRect(i))){ selectHot(i); ptrs.set(e.pointerId,{role:'none'}); return; }
  for(const b of getButtons()) if(inBox(pt,b)){ ptrs.set(e.pointerId,{role:'btn',id:b.id}); pressBtn(b.id); syncInput(); return; }
  if(P.inShop){ ptrs.set(e.pointerId,{role:'none'}); return; }
  if(P.weapon==='gun'&&P.hasPistol){ shoot(pt.x+cam.x,pt.y+cam.y); ptrs.set(e.pointerId,{role:'none'}); return; }
  ptrs.set(e.pointerId,{role:'hold'}); holdPtr++; syncInput();
},{passive:false});
cv.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') hover=toLogical(e); const p=ptrs.get(e.pointerId); if(!p) return; const pt=toLogical(e);
  if(p.role==='drag'&&overlay==='reload') relMove(pt);
  else if(p.role==='sdrag'&&overlay==='snake') snMove(pt);
  else if(p.role==='idrag'&&overlay==='inject') injMove(pt);
  else if(p.role==='invdrag'&&overlay==='inv') invMove(pt);
  else if(p.role==='fdrag'&&overlay==='flare') flareMove(pt); });
function ptrEnd(e){ const p=ptrs.get(e.pointerId); if(!p) return; ptrs.delete(e.pointerId);
  if(p.role==='hold') holdPtr=Math.max(0,holdPtr-1);
  else if(p.role==='btn'){ if(p.id==='L') btnL=Math.max(0,btnL-1); if(p.id==='R') btnR=Math.max(0,btnR-1); }
  else if(p.role==='drag'&&rel) rel.drag=null;
  else if(p.role==='sdrag'&&sn) sn.grab=false;
  else if(p.role==='idrag'&&inj) inj.drag=null;
  else if(p.role==='invdrag'&&inv) invUp(toLogical(e));
  else if(p.role==='fdrag'&&fl) fl.drag=null;
  syncInput(); }
cv.addEventListener('pointerup',ptrEnd); cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); if([' ','arrowleft','arrowright','arrowup','arrowdown','tab'].includes(k)) e.preventDefault();
  if(e.repeat) return; audioInit();
  if(scene==='menu'&&(k==='enter'||k===' ')){ menuClick(menuButtons()[menuMode==='diff'?1:0].id); return; }
  if(scene==='menu'&&k==='escape'){ menuMode='main'; return; }
  if(scene==='cut'&&(k===' '||k==='enter'||k==='escape')){ skipCut(); return; }
  if(scene==='dead'&&deadT>1.8&&(k===' '||k==='enter')){ respawn(); return; }
  if((scene==='over'||scene==='win')&&overT>1&&(k===' '||k==='enter')){ scene='menu'; menuMode='main'; return; }
  if(scene!=='play') return;
  if(k==='i'||k==='ш'||k==='tab'){ if(overlay==='inv') closeInv(); else openInv(); return; }
  if(k==='escape'&&overlay){ if(overlay==='piton') pit.g.pp=pit.prog; if(overlay==='snake') return; if(overlay==='inv'){ closeInv(); return; } overlay=null; return; }
  if(overlay==='inv') return;
  if(overlay==='flare'){ if(k==='a'||k==='arrowleft'||k==='ф') flareKey('a'); if(k==='d'||k==='arrowright'||k==='в') flareKey('d'); return; }
  if(overlay==='snake'){ if(k==='a'||k==='arrowleft'||k==='ф') snKey('a'); if(k==='d'||k==='arrowright'||k==='в') snKey('d'); return; }
  if(overlay==='inject'&&(k==='w'||k==='arrowup'||k==='ц')) inj.auto=true;
  if(!overlay&&(k==='w'||k==='arrowup'||k==='ц')) jump();
  if(k==='a'||k==='arrowleft'||k==='ф') keyL=true;
  if(k==='d'||k==='arrowright'||k==='в') keyR=true;
  if(k===' ') holdKey=true;
  if(k==='q'||k==='й') toggleWeapon();
  if(k>='1'&&k<='6'&&P.hasGear) selectHot(+k-1);
  if(k==='r'||k==='к') openReload();
  if(k==='e'||k==='у'){ if(!interact()) openPiton(); }
  if(overlay==='reload'){ if(k==='s'||k==='arrowdown'||k==='ы') rel.auto='eject'; if(k==='w'||k==='arrowup'||k==='ц') rel.auto='insert'; }
  syncInput();
});
addEventListener('keyup',e=>{ const k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft'||k==='ф') keyL=false; if(k==='d'||k==='arrowright'||k==='в') keyR=false; if(k===' ') holdKey=false; syncInput(); });
addEventListener('blur',()=>{ keyL=keyR=holdKey=false; holdPtr=0; btnL=btnR=0; ptrs.clear(); syncInput(); });

// ================= старт =================
newWorld(); for(let i=0;i<10;i++) genGrip(i); ground.dent(wreckX,46,9);
let last=performance.now();
function frame(now){ const dt=Math.min(0.033,Math.max(0,(now-last)/1000)); last=now; if(!(scene==='play'&&overlay==='inv')) T+=dt; update(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__summit={get P(){return P;},get hook(){return hook;},get scene(){return scene;},get overlay(){return overlay;},get birds(){return birds;},get rel(){return rel;},get pit(){return pit;},get sn(){return sn;},get inj(){return inj;},get inv(){return inv;},
  grip,startNew,skipCut,loadGame,latch,arrive,openReload,openInv,closeInv,invAction,openInject,injTo,snJerk,spawnBird,shoot,startFall,update,draw,input,syncInput,
  setHold(v){holdKey=v;syncInput();},setKeys(l,r){keyL=l;keyR=r;syncInput();},jump,get lastAnchor(){return lastAnchor;},set birdTimer(v){birdTimer=v;},get goats(){return goats;},get FIN(){return FIN;},get fl(){return fl;},flRubTo,igniteFlare,openFlare,get RUN(){return RUN;},winGame,respawn,selectHot,iceY,isIcy,interact,buy,SHOP_ITEMS,GUST,get sway(){return sway;}};
})();
