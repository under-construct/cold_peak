plugins { id 'com.android.application' }

android {
    namespace 'ru.summit.game'
    compileSdk 34
    defaultConfig {
        applicationId "ru.summit.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // для личной установки; для Google Play нужен свой ключ
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
